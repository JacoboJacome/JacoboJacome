name: nightly profile refresh

# Redraws every card from public GitHub data and commits assets/, README.md and scripts/state.json when they
# changed. No secret is needed; the built-in GITHUB_TOKEN only lifts the REST rate limit.
on:
  schedule:
    - cron: "23 7 * * *" # 02:23 in Colombia
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "profile.json"

permissions:
  contents: write

concurrency:
  group: nightly-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      # build.py draws from the saved copy when a source fails, then exits 1. The commit still happens and the
      # last step turns the run red so GitHub emails the owner.
      - id: build
        run: python scripts/build.py
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit the refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md scripts/state.json
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "chore: nightly profile refresh"
            git push
          fi
      - name: Fail the run when the build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "build.py failed: a source could not be fetched or the calendar is stale"
          exit 1
